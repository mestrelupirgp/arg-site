<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>...</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    height: 100vh;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}

#typing {
    position: absolute;
    top: 30%;
    width: 100%;
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 22px;
    color: #00ffcc;
    z-index: 2;
    padding: 20px;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
}

.menu {
    display: none;
    background-color: rgba(0, 0, 0, 0.7);
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    width: 280px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    box-sizing: border-box;
    z-index: 2;
}

input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    box-sizing: border-box;
    border-radius: 5px;
    text-align: center;
}

input {
    background-color: #111;
    color: white;
    border: 1px solid #444;
}

button {
    background-color: #ffffff;
    color: #000000;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.8;
}

#mensagem {
    margin-top: 10px;
    font-size: 12px;
    color: #aaaaaa;
}

.erro {
    color: #ff5fa2;
    transition: color 0.3s ease;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="typing"></div>

<div class="menu">
    <h2 id="status">?</h2>
    <input type="text" id="chave" placeholder="...">
    <button onclick="verificar()">Enviar</button>
    <p id="mensagem">responsum tuum</p>
</div>

<script>
// ================= MATRIX =================
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "アァカサタナハマヤラワ0123456789MORGANAABCDEFGELENAHIJKLMNOPALEXQRSTUVWXYZ";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];

for (let i = 0; i < columns; i++) {
    drops[i] = Math.random() * canvas.height;
}

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const hue = 160 + Math.sin(Date.now() / 2000) * 40;
    ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(drawMatrix, 50);

// ================= TYPEWRITER =================
const messages = [
    "Ciao!",
    "Aspettavo con ansia...",
    "Che ne dici di fare un gioco?",
    "Lo so!",
    "Un gioco di fantasia...",
    "come un teatro."
];

const typingDiv = document.getElementById("typing");
let msgIndex = 0;
let charIndex = 0;

function typeMessage() {
    if (msgIndex >= messages.length) {
        setTimeout(() => {
            typingDiv.style.display = "none";
            document.querySelector(".menu").style.display = "block";
        }, 1000);
        return;
    }

    if (charIndex < messages[msgIndex].length) {
        typingDiv.innerHTML += messages[msgIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeMessage, 60);
    } else {
        typingDiv.innerHTML += "<br><br>";
        msgIndex++;
        charIndex = 0;
        setTimeout(typeMessage, 800);
    }
}

typeMessage();

// ================= SENHAS =================
function b64(str) {
    return btoa(unescape(encodeURIComponent(str)));
}

function verificar() {

    var valor = document.getElementById("chave").value.toLowerCase();
    var valorB64 = b64(valor);

    if (
        valorB64 === "Y29uaGVjaW1lbnRv" ||  
        valorB64 === "bW9ydGU=" ||          
        valorB64 === "ZW5lcmdpYQ==" ||      
        valorB64 === "bWVkbw==" ||          
        valorB64 === "c2FuZ3Vl"             
    ) {
        window.open("https://imgur.com/a/En9xfea", "_blank");
    }

    else if (valorB64 === "Y3Jpc3RhbA==") { 
        window.open("https://www.youtube.com/watch?v=wnByyzY_MpI&list=PLJkOSRPJdKc-EZfw7HXODAgI24D8bSuVi&index=23", "_blank");
    }

    else if (valorB64 === "bWFyaW9uZXRl") { 
        window.open("https://x.com/acervosebastian", "_blank");
    }

    else if (valorB64 === "dGVtcHVz") { 
        window.open("luna.html", "_blank");
    }

    else if (valorB64 === "cnViM3JuNDUw") { 
        window.open("godolkin.html", "_blank");
    }

    else if (valorB64 === "bHV6ZXM=") { 
        window.open("memoryE.html", "_blank");
    }

    else if (valorB64 === "YWxlYV9pYWN0YV9lc3RfMTM=") { 
        window.open("tele.html", "_blank");
    }

    else {
        document.getElementById("mensagem").innerText = "Numpe Gô";

        const status = document.getElementById("status");
        status.innerText = "O_X";
        status.classList.add("erro");

        setTimeout(() => {
            status.innerText = "?";
            status.classList.remove("erro");
        }, 1200);
    }
}

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
